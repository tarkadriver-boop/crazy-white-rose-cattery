
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dotty's Photo Gallery | Crazy White Rose Cattery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #101010;
            color: #f5f0e6;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1,
        h2 {
            color: #d4af37;
        }

        h1 {
            font-size: 38px;
        }

        .intro {
            max-width: 650px;
            margin: 0 auto 35px;
            line-height: 1.8;
            color: #d8d0c2;
        }

        /* Dotty's photo gallery */

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .gallery img {
            display: block;
            width: 100%;
            height: 380px;
            object-fit: contain;
            padding: 6px;
            border: 2px solid #d4af37;
            border-radius: 12px;
            background-color: #101010;
        }

        /* Back to Home button — matching the Contact page */

        .button {
            display: inline-block;
            background-color: #a64d79;
            color: #ffffff;
            padding: 14px 28px;
            margin-top: 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #87365f;
        }

        footer {
            margin-top: 40px;
            color: #8f887c;
        }

        /* Mobile layout */

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 30px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 320px;
            }
        }
    </style>
</head>

<body>

    <h1>Meet Dotty ❤️</h1>

    <p class="intro">
        Every story has a beginning, and ours began with Dotty.
        Discover more moments with the special Devon Rex cat
        who inspired Crazy White Rose Cattery. 🐾
    </p>

    <h2>Dotty's Photo Gallery</h2>

    <div class="gallery">
        <img src="images/dotty3.JPEG"
             alt="Dotty, our beautiful Devon Rex cat">

        <img src="images/dotty4.JPEG"
             alt="Dotty relaxing at home">

        <img src="images/dotty5.JPEG"
             alt="Dotty, the inspiration behind our cattery">
    </div>

    <a class="button" href="index.html">Back to Home</a>

    <footer>
        Crazy White Rose Cattery | Devon Rex
    </footer>

</body>
</html>
