
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Crazy White Rose Cattery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #101010;
            color: #f5f0e6;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .paw-decoration {
            color: #d4af37;
            font-size: 30px;
            margin-bottom: 15px;
        }

        h1 {
            color: #d4af37;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .intro {
            font-size: 18px;
            line-height: 1.6;
            color: #d8d0c2;
        }

        .business-card {
            display: block;
            width: 100%;
            max-width: 650px;
            height: auto;
            margin: 35px auto;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 6px;
            background-color: #191919;
        }

        .contact-details {
            margin: 35px auto;
            padding: 25px 15px;
            border-top: 1px solid #6f5a24;
            border-bottom: 1px solid #6f5a24;
        }

        .contact-details p {
            font-size: 17px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .contact-details strong {
            color: #f5f0e6;
        }

        .contact-details a {
            color: #d4af37;
            text-decoration: none;
        }

        .contact-details a:hover {
            color: #ffffff;
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 30px auto;
        }

        .social-links a {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            padding: 13px 26px;
            border-radius: 30px;
            font-size: 16px;
            transition: background-color 0.3s ease,
                        color 0.3s ease;
        }

        .social-links a:hover {
            background-color: #d4af37;
            color: #101010;
        }

        .button {
            display: inline-block;
            background-color: #a64d79;
            color: #ffffff;
            padding: 14px 28px;
            margin-top: 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #87365f;
        }

        footer {
            margin-top: 50px;
            color: #8f887c;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 30px;
            }

            .contact-details p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <p class="paw-decoration">🐾 ♥ 🐾</p>

        <h1>Contact Us</h1>

        <p class="intro">
            We would love to hear from you!
            Get in touch with Crazy White Rose Cattery.
        </p>

        <img
            class="business-card"
            src="images/kontakt.PNG"
            alt="Crazy White Rose Cattery business card with QR codes"
        >

        <section class="contact-details">
            <p>
                <strong>Email:</strong><br>
                <a href="mailto:crazywhiterosecattery@gmail.com">
                    crazywhiterosecattery@gmail.com
                </a>
            </p>

            <p>
                <strong>Phone:</strong><br>
                <a href="tel:+447487544468">
                    07487 544468
                </a>
            </p>
        </section>

        <h2 style="color: #d4af37;">Follow Our Cats</h2>

        <div class="social-links">
            <a
                href="https://www.instagram.com/crazywhiterosecattery/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Instagram
            </a>

            <a
                href="https://www.tiktok.com/@crazywhiterosecattery"
                target="_blank"
                rel="noopener noreferrer"
            >
                TikTok
            </a>
        </div>

        <a class="button" href="index.html">
            Back to Home
        </a>

        <footer>
            Crazy White Rose Cattery | Devon Rex
        </footer>

    </main>
</body>
</html>
